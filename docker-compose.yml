# RAG middleware stack. Clients use rag-proxy :8088 (/v1). Chat and embeddings are external
# (LLAMA_SWAP_URL, EMBED_URL in docker/.env) — rag-proxy can run on a different host from LLMs.
# Optional profiles: qdrant, cognitive, llama-swap (bundled GPU router for single-box dev).
#
# Minimal (proxy only; point .env at remote Qdrant + upstream APIs):
#   cp docker/.env.example docker/.env
#   docker compose up -d --build
#
# Full homelab (Qdrant + cognitive sidecars on this host):
#   cp docker/.env.example docker/.env
#   cp docker/.env.homelab.example docker/.env.homelab
#   # QDRANT_URL=http://qdrant:6333; merge homelab flags (see docker/README.md)
#   docker compose --profile qdrant --profile cognitive up -d --build
#
# Optional bundled llama-swap (single-box GPU dev):
#   cp docker/config.yaml.example docker/config.yaml
#   docker compose --profile llama-swap up -d --build
#
# OpenAI base URL: http://<host>:8088/v1

name: rag-proxy-stack

services:
  # Optional all-in-one GPU chat + Qwen embed-pool (profile: llama-swap). Not started by default.
  llama-swap:
    profiles: [llama-swap]
    image: ${LLAMA_SWAP_IMAGE:-ghcr.io/mostlygeek/llama-swap:cuda}
    restart: unless-stopped
    ports:
      - "${LLAMA_SWAP_HOST_PORT:-8080}:8080"
    volumes:
      - ${MODELS_DIR:-/models}:/models:ro
      - ./docker/config.yaml:/app/config.yaml:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health | grep -q OK || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag_stack

  # CPU cross-encoder rerank (profile: cognitive). First start downloads ~400MB model weights.
  reranker:
    profiles: [cognitive]
    build:
      context: ./sidecars/rerank
      dockerfile: Dockerfile
    image: ${RERANKER_IMAGE:-rag-reranker:local}
    restart: unless-stopped
    ports:
      - "${RERANKER_HOST_PORT:-8095}:8095"
    environment:
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-base}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - rag_stack

  # BM25 sparse index synced from Qdrant (profile: cognitive).
  sparse-index:
    profiles: [cognitive]
    build:
      context: .
      dockerfile: sidecars/sparse/Dockerfile
    image: ${SPARSE_INDEX_IMAGE:-rag-sparse-index:local}
    restart: unless-stopped
    ports:
      - "${SPARSE_INDEX_HOST_PORT:-8096}:8096"
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-nomad_knowledge_base}
      SPARSE_REFRESH_SEC: ${SPARSE_REFRESH_SEC:-3600}
      SPARSE_INDEX_PATH: /var/lib/rag_proxy/sparse
      SPARSE_MMAP: ${SPARSE_MMAP:-true}
      SPARSE_N_THREADS: ${SPARSE_N_THREADS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - rag_proxy_state:/var/lib/rag_proxy
    depends_on:
      qdrant:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - rag_stack

  # TurboQuant dense ANN (profile: cognitive). Dual-write from ingest; proxy via DENSE_BACKEND=turbovec.
  turbovec-index:
    profiles: [cognitive]
    build:
      context: .
      dockerfile: sidecars/turbovec/Dockerfile
    image: ${TURBOVEC_IMAGE:-rag-turbovec:local}
    restart: unless-stopped
    ports:
      - "${TURBOVEC_HOST_PORT:-8097}:8097"
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-nomad_knowledge_base}
      TURBOVEC_DIM: ${TURBOVEC_DIM:-2560}
      TURBOVEC_BIT_WIDTH: ${TURBOVEC_BIT_WIDTH:-4}
      TURBOVEC_INDEX_PATH: /var/lib/rag_proxy/turbovec/index.tvim
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - rag_proxy_state:/var/lib/rag_proxy
    depends_on:
      qdrant:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - rag_stack

  rag-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${RAG_PROXY_IMAGE:-rag-proxy:local}
    restart: unless-stopped
    ports:
      - "${RAG_PROXY_HOST_PORT:-8088}:8088"
    env_file:
      - path: docker/.env
        required: true
    environment:
      # Chat/embed URLs come from docker/.env (see docker/.env.example). Do not pin
      # them here — operators point EMBED_URL at any OpenAI-compatible Qwen API.
      RERANKER_URL: http://reranker:8095
      SPARSE_INDEX_URL: http://sparse-index:8096
      TURBOVEC_URL: http://turbovec-index:8097
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: "8088"
    volumes:
      - rag_proxy_state:/var/lib/rag_proxy
    depends_on:
      reranker:
        condition: service_healthy
        required: false
      sparse-index:
        condition: service_healthy
        required: false
      turbovec-index:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/v1/models', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - rag_stack

  qdrant:
    image: qdrant/qdrant:v1.13.2
    profiles: [qdrant]
    restart: unless-stopped
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: ${QDRANT_MEM_LIMIT:-12g}
    cpus: ${QDRANT_CPUS:-4.0}
    networks:
      - rag_stack
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  rag_stack:
    driver: bridge

volumes:
  rag_proxy_state:
  qdrant_data:
