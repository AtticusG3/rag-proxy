name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Mirrored GitHub PR branches (gh-pr/*) carry code from outside contributors.
    # They are not tested automatically; a maintainer starts this workflow by hand after review.
    if: ${{ !startsWith(github.head_ref, 'gh-pr/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          # Do not upgrade pip: the runner image ships a Debian-managed pip whose
          # RECORD file is absent, so --upgrade pip fails with "Cannot uninstall pip 24.0".
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: |
          python -m pytest -q \
            --deselect tests/test_listing_parser.py::test_parse_live_dotsrc_root \
            --deselect tests/test_memgraphrag_cache.py
